name: 咪咕短时诊断
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 诊断范围
        type: choice
        options: [standard, vod, nba]
        default: standard
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 准备验证工具
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: 记录安全诊断信息
        env:
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
        run: |
          if [ "$DIAGNOSTIC_MODE" = 'nba' ]; then
            python diagnose_vod.py --environment github --targets diagnostic-nba-targets.json
          elif [ "$DIAGNOSTIC_MODE" = 'vod' ]; then
            python diagnose_vod.py --environment github
          else
            python diagnose.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migu-diagnostic-${{ github.run_id }}
          path: |
            reports/diagnostic.json
            reports/vod-comparison.json
          retention-days: 7
