name: 更新个人 IPTV 订阅

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 更新范围
        type: choice
        options: [full, events]
        default: full
  schedule:
    # 00:37 全量更新电视频道和赛程；06:37、12:37、18:37 刷新赛事。
    - cron: '37 16 * * *'
    - cron: '37 4,10,22 * * *'

permissions:
  contents: write

concurrency:
  group: personal-iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 准备视频验证工具
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: 检查工具并运行回归测试
        run: |
          command -v ffmpeg
          command -v curl
          python -m unittest discover -s tests -v
      - name: 抓取和解码验收
        id: generate
        continue-on-error: true
        env:
          UPDATE_MODE: ${{ inputs.mode }}
          UPDATE_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$UPDATE_MODE" = 'events' ] || [ "$UPDATE_SCHEDULE" = '37 4,10,22 * * *' ]; then
            python pipeline.py --events-only
          else
            python pipeline.py
          fi
      - name: 写入赛事完整性和抽测统计
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('reports/latest.json')
          if path.exists():
              data = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
                  handle.write('赛事清单完整性与线路抽测分别统计；未抽测或未测通不代表可播放。\n\n')
                  handle.write('|赛事|日期|场次|解说条目|解码通过条目|\n|---|---|---:|---:|---:|\n')
                  for league, days in data.get('competition_coverage', {}).items():
                      for day, count in days.items():
                          handle.write(f"|{league}|{day}|{count['matches']}|{count['entries']}|{count['decoded_entries']}|\n")
                  handle.write('\n警告：' + ', '.join(data.get('warnings', [])) + '\n')
          PY
      - name: 保存本轮验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: reports/latest.json
          if-no-files-found: warn
          retention-days: 14
      - name: 发布通过验收的订阅
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public reports/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh verified IPTV playlists [skip ci]'
          git push origin HEAD:main
      - name: 标记未通过验收
        if: steps.generate.outcome != 'success'
        run: |
          echo '本次未发布，保留上次通过验收的订阅。请查看 verification 报告。'
          exit 1
