name: 更新个人 IPTV 订阅

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 更新范围
        type: choice
        options: [auto, full, events]
        default: auto
      check_event:
        description: 额外检查的赛事名称（可留空）
        type: string
        required: false
  schedule:
    # 每小时检查；当天首次成功时全量检测，之后仅刷新赛事。
    - cron: '37 * * * *'

permissions:
  contents: write

concurrency:
  group: personal-iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 准备视频验证工具
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: 检查工具并运行回归测试
        run: |
          command -v ffmpeg
          command -v curl
          python -m unittest discover -s tests -v
      - name: 抓取和解码验收
        id: generate
        continue-on-error: true
        env:
          UPDATE_MODE: ${{ inputs.mode }}
          CHECK_EVENT: ${{ inputs.check_event }}
        run: |
          pipeline_args=(--check-event "$CHECK_EVENT")
          if [ "$UPDATE_MODE" = 'events' ]; then
            pipeline_args+=(--events-only)
          elif [ "$UPDATE_MODE" != 'full' ]; then
            pipeline_args+=(--auto)
          fi
          set +e
          python pipeline.py "${pipeline_args[@]}"
          pipeline_status=$?
          set -e
          if [ "$pipeline_status" -eq 3 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::上游明日赛程尚未更新；本轮保留原订阅，下一次自动重试。'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          exit "$pipeline_status"
      - name: 写入赛程和实际通过检测的统计
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('reports/latest.json')
          if path.exists():
              data = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
                  handle.write('主订阅只发布通过检测的入口；完整赛程及受限状态见 public/schedule.md。\n\n')
                  if data.get('deferred'):
                      handle.write('本轮未发布：上游明日赛程未更新，保留原订阅，下次自动重试；未进行视频检测。\n\n')
                  handle.write('|赛事|日期|场次|解说条目|解码通过条目|\n|---|---|---:|---:|---:|\n')
                  for league, days in data.get('competition_coverage', {}).items():
                      for day, count in days.items():
                          handle.write(f"|{league}|{day}|{count['matches']}|{count['entries']}|{count['decoded_entries']}|\n")
                  handle.write('\n主订阅赛事条目：' + str(data.get('published_events', 0)) + '\n')
                  handle.write('\n警告：' + ', '.join(data.get('warnings', [])) + '\n')
          PY
      - name: 保存本轮验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: reports/latest.json
          if-no-files-found: warn
          retention-days: 14
      - name: 独立检查发布文件和逐条检测凭据
        if: steps.generate.outcome == 'success' && steps.generate.outputs.ready == 'true'
        run: python verify_publication.py
      - name: 发布通过验收的订阅
        if: steps.generate.outcome == 'success' && steps.generate.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public reports/latest.json state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh verified IPTV playlists [skip ci]'
          git push origin HEAD:main
      - name: 标记未通过验收
        if: steps.generate.outcome != 'success'
        run: |
          echo '本次未发布，保留上次通过验收的订阅。请查看 verification 报告。'
          exit 1
