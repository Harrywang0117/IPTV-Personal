name: 回归测试
on:
  push:
    paths: ['pipeline.py', 'discover.py', 'verify_publication.py', 'config.json', 'candidate-sources.json', 'vendor/**', 'tests/**', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: 核对当前发布文件
        run: python verify_publication.py
